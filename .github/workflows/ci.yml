name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The Dockerfile does the full Nuxt build, so there is no separate lint/test lane:
  # a green image build IS the check. On PRs we build and smoke-test but don't push.
  build-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: registry.apps.vernaillen.dev/fftvisualizer-com
      # Not a secret: the endpoint is useless without COOLIFY_TOKEN. Keeping it here
      # means REGISTRY_USERNAME / REGISTRY_PASSWORD / COOLIFY_TOKEN can all live as
      # harmonics-audio org secrets, with nothing to configure per repo.
      COOLIFY_DEPLOY_URL: https://coolify.apps.vernaillen.dev/api/v1/deploy?uuid=qxmcfvsxq6g324r63dl93wti&force=false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: registry.apps.vernaillen.dev
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # load: true keeps the image local so we can smoke-test it before pushing
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (boot the image, assert it serves and reports healthy)
        run: |
          docker run -d --name smoke -p 3000:3000 "${IMAGE}:${{ github.sha }}"

          serving=0
          health=starting
          for i in $(seq 1 90); do
            if [ "$serving" = 0 ] && curl -fsS -o /dev/null http://localhost:3000/; then serving=1; fi
            health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' smoke)
            if [ "$serving" = 1 ] && [ "$health" != starting ]; then break; fi
            sleep 1
          done

          # Everything probed so far is prerendered, and prerendered output keeps serving
          # even when the runtime content DB can't be opened. Probe a real runtime content
          # query too — that is the only surface a non-writable .output actually breaks.
          mcp=$(curl -sS -X POST http://localhost:3000/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"list-pages","arguments":{}}}' || true)

          echo "serving=$serving health=$health"
          echo "----- mcp list-pages -----"; echo "$mcp" | head -c 500; echo
          echo "----- container logs -----"; docker logs smoke || true
          echo "----- healthcheck log -----"
          docker inspect -f '{{if .State.Health}}{{range .State.Health.Log}}exit={{.ExitCode}} {{printf "%q" .Output}}{{"\n"}}{{end}}{{end}}' smoke || true
          docker rm -f smoke >/dev/null 2>&1 || true

          [ "$serving" = 1 ] || { echo "::error::Smoke test failed — image did not serve on :3000"; exit 1; }
          # The in-image HEALTHCHECK runs *inside* the container, so it catches bind-address
          # and localhost/IPv6 mistakes that a published-port curl from the runner cannot.
          # Coolify gates its proxy switchover on this, so an unhealthy image never goes live.
          [ "$health" = healthy ] || { echo "::error::Smoke test failed — container health is '$health', expected healthy"; exit 1; }
          case "$mcp" in
            *'"isError":true'*|'') echo "::error::Smoke test failed — /mcp list-pages did not return content (runtime content DB unreadable?)"; exit 1 ;;
          esac

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"

      # Coolify pulls :latest but won't redeploy on its own — hit its deploy API so
      # the new image goes live. The endpoint must be reachable from GitHub-hosted runners.
      - name: Trigger Coolify redeploy
        if: github.ref == 'refs/heads/main'
        run: |
          curl --fail-with-body -sS "$COOLIFY_DEPLOY_URL" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
