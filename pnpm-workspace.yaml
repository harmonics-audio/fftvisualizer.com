allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  vue-demi: true
minimumReleaseAgeExclude:
  # Our own packages, so the release-age delay never blocks the docs site from
  # picking up a version we just published. Left unversioned deliberately: pinned
  # entries went stale the moment 0.5.0 shipped.
  - '@fft-visualizer/vue'
  - '@fft-visualizer/core'
